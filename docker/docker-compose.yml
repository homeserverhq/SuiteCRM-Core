      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: /repos/SuiteCRM-Core
      dockerfile: docker/php/Dockerfile
    container_name: suitecrm-nginx
    networks:
      - suitecrm-network
      - dock-ext-net
    ports:
      - "${SUITECRM_PORT:-8040}:80"
    volumes:
      - /repos/SuiteCRM-Core/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - suitecrm-legacy-cache:/var/www/html/public/legacy/cache
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  cron:
    build:
      context: /repos/SuiteCRM-Core
      dockerfile: docker/php/Dockerfile
