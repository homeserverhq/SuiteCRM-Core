      SUITECRM_LDAP_SEARCH_DN: ${SUITECRM_LDAP_SEARCH_DN:-}
      SUITECRM_LDAP_SEARCH_PASSWORD: ${SUITECRM_LDAP_SEARCH_PASSWORD:-}
      SUITECRM_LDAP_AUTO_CREATE: ${SUITECRM_LDAP_AUTO_CREATE:-disabled}
      SUITECRM_LDAP_PROVIDER_BASE_DN: ${SUITECRM_LDAP_PROVIDER_BASE_DN:-}
      SUITECRM_LDAP_PROVIDER_SEARCH_DN: ${SUITECRM_LDAP_PROVIDER_SEARCH_DN:-}
      SUITECRM_LDAP_PROVIDER_UID_KEY: ${SUITECRM_LDAP_PROVIDER_UID_KEY:-uid}
      SUITECRM_LDAP_PROVIDER_FILTER: ${SUITECRM_LDAP_PROVIDER_FILTER:-}
      SUITECRM_LDAP_PROVIDER_DEFAULT_ROLES: ${SUITECRM_LDAP_PROVIDER_DEFAULT_ROLES:-ROLE_USER}
      SUITECRM_LDAP_GROUP_NAME: ${SUITECRM_LDAP_GROUP_NAME:-primaryusers}
      SUITECRM_LDAP_GROUP_ATTR: ${SUITECRM_LDAP_GROUP_ATTR:-uniqueMember}
      SUITECRM_LDAP_GROUP_OBJECTCLASS: ${SUITECRM_LDAP_GROUP_OBJECTCLASS:-groupOfUniqueNames}
      SUITECRM_LDAP_GROUP_BASE_DN: ${SUITECRM_LDAP_GROUP_BASE_DN:-ou=groups,dc=example,dc=com}
      SUITECRM_REFERER_HOST: ${SUITECRM_REFERER_HOST:-}
      SUITECRM_CORS_ALLOW_ORIGIN: ${SUITECRM_CORS_ALLOW_ORIGIN:-}
    command: ["cron"]
    depends_on:
      app:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  worker:
