      SUITECRM_LDAP_GROUP_NAME: ${SUITECRM_LDAP_GROUP_NAME:-primaryusers}
      SUITECRM_LDAP_GROUP_ATTR: ${SUITECRM_LDAP_GROUP_ATTR:-uniqueMember}
      SUITECRM_LDAP_GROUP_OBJECTCLASS: ${SUITECRM_LDAP_GROUP_OBJECTCLASS:-groupOfUniqueNames}
